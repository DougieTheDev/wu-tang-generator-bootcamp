<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate a Wu Tang Clan-like Name</title>
</head>
<body>
    <div class="container">
        <h1>Generate a Wu Tang Clan-like Name</h1>
        <form id="wuTangForm">
            <input type="text" id="firstName" placeholder="First name" required>
            <input type="text" id="lastName" placeholder="Last name" required>
            <input type="text" id="currentCity" placeholder="Current City" required>
            <input type="text" id="birthCity" placeholder="Birth City" required>
            <input type="text" id="birthMonth" placeholder="Birth month(ex. January, February etc)" required>
            <button type="submit">Generate</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
